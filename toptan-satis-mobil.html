<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#24399a">
<title>Toptan Satış Oluştur</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
:root{
  --brand:#24399a; --brand-ink:#1b2c7a; --brand-soft:#eef1fb;
  --bg-body:#f1f5f9; --card:#fff; --text:#0f172a; --text-2:#475569; --muted:#64748b;
  --border:#e2e8f0; --border-2:#cbd5e1; --ok:#16a34a; --danger:#dc2626;
  --r-card:12px; --r-ctl:10px; --tap:48px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;overflow-x:hidden}
body{font-family:"Plus Jakarta Sans",system-ui,sans-serif;background:var(--bg-body);color:var(--text);font-size:15px;line-height:1.4;
  padding-bottom:calc(88px + env(safe-area-inset-bottom))}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
.mono{font-family:"JetBrains Mono",monospace}

/* Üst bar: tek satır, sadece gerekli bilgi */
.topbar{position:sticky;top:0;z-index:20;background:var(--card);border-bottom:1px solid var(--border);
  padding:calc(8px + env(safe-area-inset-top)) 12px 8px;display:flex;align-items:center;gap:8px}
.icon-btn{width:40px;height:40px;border-radius:10px;display:grid;place-items:center;flex:none}
.icon-btn:active{background:var(--bg-body)}
.topbar h1{font-size:16px;font-weight:700;margin:0;flex:1;min-width:0}
.topbar h1 small{display:block;font-size:12px;font-weight:500;color:var(--muted)}
.rates{display:flex;gap:4px;flex:none}
.rate{font-size:12px;font-weight:600;padding:4px 7px;border-radius:6px;background:var(--brand-soft);color:var(--brand)}
.rate.usd{background:#ecfdf3;color:#15803d}

/* Adım göstergesi */
.steps{display:flex;gap:6px;padding:10px 16px 0}
.steps span{flex:1;height:4px;border-radius:2px;background:var(--border-2)}
.steps span.on{background:var(--brand)}
.step-label{padding:6px 16px 0;font-size:12px;color:var(--muted)}

main{padding:12px 16px;display:flex;flex-direction:column;gap:12px;max-width:640px;margin:0 auto}
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--r-card)}
.card-h{padding:12px 14px 4px;font-size:12px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--muted)}

/* Seçim satırı: tüm satır dokunulabilir, sağda ok */
.row{display:flex;align-items:center;gap:12px;width:100%;min-height:56px;padding:8px 14px;text-align:left}
.row + .row{border-top:1px solid var(--border)}
.row:active{background:var(--bg-body)}
.row .ic{width:36px;height:36px;border-radius:9px;background:var(--brand-soft);color:var(--brand);display:grid;place-items:center;flex:none}
.row .tx{flex:1;min-width:0}
.row .lb,.row .vl,.switch-row .lb,.switch-row .hint{display:block}
.row .lb{font-size:12px;color:var(--muted)}
.row .vl{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .vl.empty{color:var(--muted);font-weight:500}
.row .chev{color:var(--border-2);flex:none}

/* Müşteri kartı: ekranın en önemli bilgisi */
.cust{display:flex;align-items:center;gap:12px;padding:14px}
.avatar{width:48px;height:48px;border-radius:50%;background:var(--brand);color:#fff;display:grid;place-items:center;font-weight:700;font-size:17px;flex:none}
.cust .tx{flex:1;min-width:0}
/* Uzun cari adı: 2 satır görünür, kalanı yana kaydırılarak okunur (taşan metin sağdaki sütuna akar) */
.cust .nm{font-size:17px;font-weight:700;line-height:1.3;height:2.6em;column-width:100vw;column-gap:16px;column-fill:auto;
  overflow-x:auto;overflow-y:hidden;scrollbar-width:none;overscroll-behavior-x:contain}
.cust .nm::-webkit-scrollbar{display:none}
/* Kimlik bilgileri: TC/VKN, ÜTS yan yana, vergi dairesi en sağda */
.cust{flex-wrap:wrap}
.cust .ids{flex-basis:100%}
.ids{display:flex;flex-wrap:wrap;align-items:center;gap:4px 6px;font-size:12px;color:var(--text-2)}
.ids:empty{display:none}
.id-chip{display:inline-flex;align-items:center;gap:4px;height:24px;padding:0 7px;border-radius:6px;background:var(--bg-body);white-space:nowrap}
.id-chip svg{color:var(--brand);flex:none}
.id-chip.vd{margin-left:auto}
.cs-item .tx{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}
.cs-item .ids{font-size:11px}
.cs-item .id-chip{height:22px}
.pill-btn{height:36px;padding:0 14px;border-radius:18px;background:var(--brand-soft);color:var(--brand);font-weight:600;font-size:14px;flex:none}

/* Segment kontrol (Vergi tipi, Para birimi) */
.field{padding:10px 14px 14px}
.field + .field{border-top:1px solid var(--border)}
.field > .lb{font-size:13px;font-weight:600;color:var(--text-2);margin-bottom:8px;display:flex;justify-content:space-between;gap:8px}
.seg{display:flex;background:var(--bg-body);border-radius:var(--r-ctl);padding:3px;gap:3px}
.seg button{flex:1;min-height:42px;border-radius:8px;font-weight:600;color:var(--text-2)}
.seg button[aria-pressed="true"]{background:var(--card);color:var(--brand);box-shadow:0 1px 3px rgba(15,23,42,.12)}
.seg-type{background:var(--border);padding:4px}
.seg-type button{min-height:48px;font-size:16px}
.seg-type button[aria-pressed="true"]{background:var(--brand);color:#fff}
/* Müşteri arama */
.cs{padding:12px}
.cs-box{display:flex;align-items:center;gap:8px;min-height:52px;padding:0 6px 0 12px;border:2px solid var(--brand);border-radius:var(--r-ctl);color:var(--muted)}
.cs-box input{border:0;outline:0;padding:0;min-height:48px;flex:1;min-width:0}
.cs-box input:focus{outline:0}
.cs-box input::-webkit-search-cancel-button{display:none}
.cs-clear{width:40px;height:40px;border-radius:50%;color:var(--muted);font-size:16px}
.cs-h{font-size:12px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);padding:12px 2px 4px}
.cs-item{display:flex;align-items:center;gap:12px;width:100%;min-height:52px;padding:6px 2px;text-align:left;border-top:1px solid var(--border)}
.cs-item:first-child{border-top:0}
.cs-item:active,.cs-item.hl{background:var(--brand-soft)}
.cs-item .avatar{width:36px;height:36px;font-size:13px}
.cs-item .nm{flex:1;min-width:0;font-weight:600;line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.cs-item mark{background:#fef08a;color:inherit;border-radius:2px}
.cs-empty{padding:16px 2px;color:var(--muted);font-size:14px}
main.need-cust > section:not(#custCard){opacity:.4;pointer-events:none}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chips button{min-height:40px;padding:0 14px;border-radius:20px;border:1px solid var(--border-2);font-weight:600;font-size:14px;color:var(--text-2)}
.chips button[aria-pressed="true"]{background:var(--brand);border-color:var(--brand);color:#fff}

input,textarea{font:inherit;font-size:16px;color:var(--text);width:100%;min-height:var(--tap);border:1px solid var(--border-2);
  border-radius:var(--r-ctl);padding:10px 12px;background:var(--card)}
input:focus,textarea:focus{outline:2px solid var(--brand);outline-offset:1px;border-color:var(--brand)}
textarea{resize:vertical;min-height:80px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.two label{font-size:12px;color:var(--muted);display:block;margin-bottom:4px}

/* Anahtar */
.switch-row{display:flex;align-items:center;gap:12px;min-height:56px;padding:8px 14px}
.switch-row .tx{flex:1}
.switch-row .lb{font-weight:600}
.switch-row .hint{font-size:12px;color:var(--muted)}
.switch{position:relative;width:52px;height:32px;flex:none}
.switch input{position:absolute;inset:0;opacity:0;margin:0;min-height:0;cursor:pointer}
.switch i{position:absolute;inset:0;border-radius:16px;background:var(--border-2);transition:background .2s;pointer-events:none}
.switch i::after{content:"";position:absolute;top:3px;left:3px;width:26px;height:26px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.2);transition:transform .2s}
.switch input:checked + i{background:var(--brand)}
.switch input:checked + i::after{transform:translateX(20px)}
.switch input:focus-visible + i{outline:2px solid var(--brand);outline-offset:2px}
[hidden]{display:none!important}

/* Alt eylem çubuğu: başparmak bölgesi */
.actionbar{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--card);border-top:1px solid var(--border);
  padding:10px 16px calc(10px + env(safe-area-inset-bottom));display:flex;gap:8px}
.actionbar .icon-btn{width:52px;height:52px;border:1px solid var(--border-2);border-radius:12px}
.primary{flex:1;height:52px;border-radius:12px;background:var(--brand);color:#fff;font-weight:700;font-size:16px;display:flex;align-items:center;justify-content:center;gap:8px}
.primary:active{background:var(--brand-ink)}

/* Alt sayfa (bottom sheet) */
.scrim{position:fixed;inset:0;background:rgba(15,23,42,.45);z-index:40;opacity:0;pointer-events:none;transition:opacity .2s}
.scrim.open{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:41;background:var(--card);border-radius:16px 16px 0 0;max-height:80vh;max-height:80dvh;overflow:auto;
  transform:translateY(100%);transition:transform .25s cubic-bezier(.2,.8,.2,1);padding-bottom:env(safe-area-inset-bottom)}
.sheet.open{transform:none}
.sheet .grab{width:40px;height:4px;border-radius:2px;background:var(--border-2);margin:8px auto}
.sheet h2{font-size:16px;margin:4px 16px 8px}
.opt{display:flex;align-items:center;gap:12px;width:100%;min-height:52px;padding:10px 16px;text-align:left;border-top:1px solid var(--border)}
.opt[aria-selected="true"]{color:var(--brand);font-weight:700}
.opt[aria-selected="true"]::after{content:"✓";margin-left:auto}
.grid-acts{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;padding:8px 16px 16px}
.grid-acts button{display:flex;flex-direction:column;align-items:center;gap:6px;padding:12px 4px;border-radius:12px;background:var(--bg-body);font-size:12px;font-weight:600;text-align:center}
.grid-acts button:disabled{opacity:.4}
.grid-acts svg{color:var(--brand)}

.toast{position:fixed;left:16px;right:16px;bottom:calc(84px + env(safe-area-inset-bottom));z-index:50;background:var(--text);color:#fff;border-radius:10px;padding:12px 14px;font-size:14px;
  opacity:0;transform:translateY(8px);transition:.2s;pointer-events:none;max-width:608px;margin:0 auto}
.toast.show{opacity:1;transform:none}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>

<header class="topbar">
  <button class="icon-btn" aria-label="Menü"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 6h16M4 12h16M4 18h16"/></svg></button>
  <h1>Toptan Satış<small>Boğaziçi Diş Deposu</small></h1>
  <div class="rates" aria-label="Döviz kurları">
    <span class="rate usd mono">$ 50,20</span><span class="rate mono">€ 55,92</span>
  </div>
</header>

<div class="steps" aria-hidden="true"><span class="on"></span><span></span><span></span></div>
<div class="step-label">Adım 1/3 · Fatura Bilgileri → Ürün Seçimi → Kargo Bilgileri ve Gönderim</div>

<main class="need-cust" id="main">
  <!-- 0. Sipariş türü: hangi depoya gireceğini belirler -->
  <div class="seg seg-type" data-group="depot" role="group" aria-label="Sipariş türü">
    <button aria-pressed="true" data-depot="dental">Dental Sipariş</button><button aria-pressed="false" data-depot="ecza">Ecza Sipariş</button>
  </div>

  <!-- 1. Müşteri: en sık değişen, en üstte -->
  <section class="card" id="custCard" aria-label="Müşteri">
    <!-- Arama durumu: sayfa açılınca odak burada -->
    <div class="cs" id="custSearch">
      <label class="cs-box">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/></svg>
        <input id="custQ" type="search" placeholder="Ad, VKN/TC veya ÜTS ile ara" autocomplete="off" autocorrect="off" spellcheck="false" enterkeyhint="search"
          aria-label="Müşteri ara" aria-controls="custList" oninput="renderCust()" onkeydown="custKey(event)">
        <button type="button" class="cs-clear" id="custClear" hidden aria-label="Aramayı temizle" onclick="clearCust()">✕</button>
      </label>
      <div class="cs-h" id="custHead"></div>
      <div id="custList" role="listbox" aria-label="Müşteriler"></div>
    </div>
    <div class="cust" id="custSel" hidden>
      <div class="avatar" id="custInitials">DA</div>
      <div class="tx">
        <div class="nm" id="custName" tabindex="0">davut akbulut</div>
      </div>
      <button class="pill-btn" onclick="changeCust()">Değiştir</button>
      <div class="ids" id="custIds"></div>
    </div>
    <button class="row" id="salesRow" hidden onclick="openPicker('sales')">
      <span class="ic"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="4" y="5" width="16" height="16" rx="2"/><path d="M10 2h4v4h-4zM8.5 17c.5-1.7 1.9-2.5 3.5-2.5s3 .8 3.5 2.5"/><circle cx="12" cy="11" r="2"/></svg></span>
      <span class="tx"><span class="lb">Satış Sorumlusu</span><span class="vl" data-v="sales">DAVUT AKBULUT</span></span>
      <svg class="chev" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m9 6 6 6-6 6"/></svg>
    </button>
  </section>

  <!-- 2. Adres: aynıysa tek satır -->
  <section class="card" aria-label="Adres">
    <div class="card-h">Adres</div>
    <button class="row" onclick="openPicker('ship')">
      <span class="ic"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 21s-7-6.5-7-12a7 7 0 0 1 14 0c0 5.5-7 12-7 12z"/><circle cx="12" cy="9" r="2.5"/></svg></span>
      <span class="tx"><span class="lb">Teslimat Adresi</span><span class="vl" data-v="ship">Molla Gürani, Uygar Sokağı No:17 A, Fatih İstanbul Türkiye</span></span>
      <svg class="chev" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m9 6 6 6-6 6"/></svg>
    </button>
    <div class="switch-row" style="border-top:1px solid var(--border)">
      <span class="tx"><span class="lb">Fatura adresi aynı</span><span class="hint">Kapatırsanız ayrı seçilir</span></span>
      <label class="switch"><input type="checkbox" id="sameAddr" checked onchange="toggleSameAddr()" aria-label="Fatura adresi teslimat ile aynı"><i></i></label>
    </div>
    <button class="row" id="billRow" hidden onclick="openPicker('bill')">
      <span class="ic"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 3h12v18l-3-2-3 2-3-2-3 2zM9 8h6M9 12h6"/></svg></span>
      <span class="tx"><span class="lb">Fatura Adresi</span><span class="vl" data-v="bill">Molla Gürani, Uygar Sokağı No:17 A, Fatih İstanbul Türkiye</span></span>
      <svg class="chev" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m9 6 6 6-6 6"/></svg>
    </button>
  </section>

  <!-- 3. Fiyatlandırma ve ödeme: açılır menü yerine segment -->
  <section class="card" aria-label="Ödeme">
    <div class="card-h">Fiyat ve ödeme</div>
    <div class="field">
      <div class="lb">Vergi Tipi</div>
      <div class="seg" data-group="tax">
        <button aria-pressed="true">Vergili</button><button aria-pressed="false">Vergisiz</button>
      </div>
    </div>
    <div class="switch-row" style="border-top:1px solid var(--border)">
      <span class="tx"><span class="lb">Vadeli Ödeme</span><span class="hint" id="dueHint">Vade: 13.11.2026 (7 gün)</span></span>
      <label class="switch"><input type="checkbox" id="isCreditSale" checked onchange="toggleCredit()" aria-label="Vadeli ödeme"><i></i></label>
    </div>
    <div class="field" id="dueWrap" style="padding-top:0;border-top:0">
      <div class="chips" data-group="due">
        <button aria-pressed="true" data-d="7">7 gün</button><button aria-pressed="false" data-d="15">15</button><button aria-pressed="false" data-d="30">30</button><button aria-pressed="false" data-d="45">45</button><button aria-pressed="false" data-d="60">60</button>
      </div>
      <div class="two" style="margin-top:10px">
        <div><label for="processDate">İşlem Tarihi</label><input type="date" id="processDate" value="2026-11-06" onchange="applyDue()"></div>
        <div><label for="dueDate">Vade Tarihi</label><input type="date" id="dueDate" value="2026-11-13" onchange="customDue()"></div>
      </div>
    </div>
  </section>

  <!-- 4. Açıklama -->
  <section class="card" aria-label="Açıklama">
    <button class="row" id="noteBtn" onclick="showNote()">
      <span class="ic"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 20h4L19 9l-4-4L4 16zM14 6l4 4"/></svg></span>
      <span class="tx"><span class="lb">Açıklama</span><span class="vl empty">Not ekle (isteğe bağlı)</span></span>
    </button>
    <div class="field" id="noteWrap" hidden style="border-top:1px solid var(--border)">
      <label for="description" class="lb">Açıklama</label>
      <textarea id="description" placeholder="Siparişle ilgili not"></textarea>
    </div>
  </section>

  <!-- 5. Para birimi -->
  <section class="card" aria-label="Para birimi">
    <div class="field">
      <div class="lb"><span>Para Birimi</span><span class="mono" id="rateNote" style="color:var(--muted);font-weight:500">Kur: 1</span></div>
      <div class="seg" data-group="cur">
        <button aria-pressed="true" data-rate="1">₺ TL</button><button aria-pressed="false" data-rate="50,20">$ USD</button><button aria-pressed="false" data-rate="55,92">€ EUR</button>
      </div>
      <div id="rateWrap" hidden style="margin-top:8px">
        <label for="exchangeRate" style="font-size:12px;color:var(--muted)">Döviz Kuru (düzenlenebilir)</label>
        <input id="exchangeRate" class="mono" inputmode="decimal" value="1">
      </div>
    </div>
  </section>
</main>

<!-- Alt eylem çubuğu -->
<nav class="actionbar" aria-label="Sipariş işlemleri">
  <button class="icon-btn" aria-label="Diğer işlemler" onclick="openSheet('actSheet')"><svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor"><circle cx="5" cy="12" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="19" cy="12" r="2"/></svg></button>
  <button class="icon-btn" aria-label="Barkod okut" onclick="toast('Barkod okuyucu açılır')"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 7V4h3M21 7V4h-3M3 17v3h3M21 17v3h-3M7 8v8M10 8v8M13 8v8M17 8v8"/></svg></button>
  <button class="primary" onclick="saveHeader()">Kaydet, ürün ekle <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M5 12h14M13 6l6 6-6 6"/></svg></button>
</nav>

<div class="scrim" id="scrim" onclick="closeSheets()"></div>

<!-- Seçim sayfası (tüm açılır menüler için tek) -->
<div class="sheet" id="pickSheet" role="dialog" aria-modal="true" aria-labelledby="pickTitle">
  <div class="grab"></div>
  <h2 id="pickTitle"></h2>
  <div id="pickList" role="listbox"></div>
</div>

<!-- Diğer işlemler: eski 11 butonluk araç çubuğu -->
<div class="sheet" id="actSheet" role="dialog" aria-modal="true" aria-label="Diğer işlemler">
  <div class="grab"></div>
  <h2>İşlemler</h2>
  <div class="grid-acts">
    <button onclick="toast('Yeni sayfa')"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12h14"/></svg>Yeni Sayfa</button>
    <button onclick="toast('Müşteri ekle')"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="9" cy="8" r="3"/><path d="M3 20c0-3 3-5 6-5s6 2 6 5M18 8v6M15 11h6"/></svg>Müşteri Ekle</button>
    <button onclick="toast('Müşteri güncelle')"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="9" cy="8" r="3"/><path d="M3 20c0-3 3-5 6-5M14 20l1-3 5-5 2 2-5 5z"/></svg>Müşteri Güncelle</button>

<script>
// Seçenekler yalnızca ekrandaki gerçek değerlerdir (GEMINI.md E); canlıda API'den gelir.

const CUSTOMERS = ['T.C. İSTANBUL AYDIN ÜNİVERSİTESİ AĞIZ VE DİŞ SAĞLIĞI UYGULAMA VE ARAŞ. MERKEZİ','davut akbulut','AVRASYA DİŞ HASTANESİ LTD.','AYŞE KARACA','CAN DİŞ PROTEZ LABORATUVARI','DENTA NORA AĞIZ VE DİŞ SAĞLIĞI POLİKLİNİĞİ','DENTAL İSTANBUL A.Ş.','DENTAPOL DENTAL SAĞLIK HİZM. LTD.','DEPO KADİR ÖZDEMİR','DR. AHMET YILMAZ DİŞ KLİNİĞİ','DR. ALTAN DEMİREL','DR. BURAK ÖZKAN POLİKLİNİĞİ','DR. EMRE AKTAŞ KLİNİĞİ','DR. HAKAN ÖZKUL','DR. SELİM ERGÜN MUAYENEHANESİ','DR. TOLGA YILDIZ POLİKLİNİĞİ','DT. MİRDASH LLESHI','ERDİ EKİZ','ESTETİK DENT AĞIZ VE DİŞ SAĞLIĞI POL.','FATİH YİĞİT YİĞİT DENTAL','FEYZULLAH AHISKALI','GÖKSU DENTAL TİC. LTD.','GÜLÜŞ AĞIZ VE DİŞ SAĞLIĞI POLİKLİNİĞİ A.Ş.','KUTAY HOCA','KUTLU MEDİKAL LTD.','MARMARA İMPLANT VE DİŞ MERKEZİ','MEDİPORT DİŞ SAĞLIK MERKEZİ A.Ş.','MEGA DENT POLİKLİNİĞİ A.Ş.','MEHMET CAN','MEHRAN AMINIFARD','MUHAMMET UĞUR DERE','SEMA DENTAL MEDİKAL TİC. LTD.','SERAP BOZTEKE','ÖZEL DENTAPARK POLİKLİNİĞİ','ÖZEL GEBZE ÇAPA AĞIZ VE DİŞ SAĞLIĞI POLİKLİNİĞİ','ÖZLEM DENTAL KLİNİĞİ A.Ş.','ÜLKÜ TÜRKMEN','ÜMİT VELİOĞLU'];
// Cari kimlik bilgisi: [kimlik türü, no, vergi dairesi, ÜTS] (index.html sipariş verisinden)
const CUST_INFO = {"ÜMİT VELİOĞLU": ["VKN", "5490309762", "Kadıköy V.D.", "2660005490309"], "ÖZEL GEBZE ÇAPA AĞIZ VE DİŞ SAĞLIĞI POLİKLİNİĞİ": ["VKN", "6850803026", "Gebze V.D.", "2660006850803"], "ERDİ EKİZ": ["VKN", "4448888888", "Bakırköy V.D.", "2660004448888"], "DEPO KADİR ÖZDEMİR": ["VKN", "1111111111", "Kadıköy V.D.", "2660001111111"], "SEMA DENTAL MEDİKAL TİC. LTD.": ["VKN", "7600986197", "Küçükyalı V.D.", "2660007600986"], "FATİH YİĞİT YİĞİT DENTAL": ["VKN", "58291049281", "Kartal V.D.", "2660005829104"], "ÜLKÜ TÜRKMEN": ["VKN", "54719732262", "Beyoğlu V.D.", "2660005471973"], "FEYZULLAH AHISKALI": ["VKN", "4918203918", "Zeytinburnu V.D.", "2660004918203"], "DR. HAKAN ÖZKUL": ["VKN", "7010104003", "Şişli V.D.", "2660007010104"], "KUTAY HOCA": ["VKN", "44421321321", "Üsküdar V.D.", "2660004442132"], "DT. MİRDASH LLESHI": ["VKN", "5091126687", "Şişli V.D.", "2660005091126"], "MEHRAN AMINIFARD": ["VKN", "4423222221", "Beşiktaş V.D.", "2660004423222"], "MUHAMMET UĞUR DERE": ["VKN", "1231203912", "Kadıköy V.D.", "2660001231203"], "DR. ALTAN DEMİREL": ["VKN", "29104829104", "Bakırköy V.D.", "2660002910482"], "DENTA NORA AĞIZ VE DİŞ SAĞLIĞI POLİKLİNİĞİ": ["VKN", "2921007027", "Maltepe V.D.", "2660002921007"], "ÖZEL DENTAPARK POLİKLİNİĞİ": ["VKN", "8472910482", "Kadıköy V.D.", "2660008472910"], "SERAP BOZTEKE": ["TC", "38491029481", "Üsküdar V.D.", "2660001928374"], "DR. AHMET YILMAZ DİŞ KLİNİĞİ": ["VKN", "29104829104", "Şişli V.D.", "2660003920194"], "DENTAPOL DENTAL SAĞLIK HİZM. LTD.": ["VKN", "39482019482", "Bakırköy V.D.", "2660009182734"], "DR. EMRE AKTAŞ KLİNİĞİ": ["VKN", "19482019481", "Beyoğlu V.D.", "2660004928172"], "KUTLU MEDİKAL LTD.": ["VKN", "58492019482", "Fatih V.D.", "2660005928173"], "MEGA DENT POLİKLİNİĞİ A.Ş.": ["VKN", "69482019481", "Kartal V.D.", "2660006928174"], "CAN DİŞ PROTEZ LABORATUVARI": ["VKN", "79482019482", "Pendik V.D.", "2660007928175"], "AVRASYA DİŞ HASTANESİ LTD.": ["VKN", "89482019483", "Zeytinburnu V.D.", "2660008928176"], "AYŞE KARACA": ["TC", "48291048291", "Ataşehir V.D.", "2660004829104"], "MARMARA İMPLANT VE DİŞ MERKEZİ": ["VKN", "99482019484", "Ümraniye V.D.", "2660009928177"], "DR. SELİM ERGÜN MUAYENEHANESİ": ["VKN", "10482019485", "Beylikdüzü V.D.", "2660001028178"], "DENTAL İSTANBUL A.Ş.": ["VKN", "20482019486", "Beşiktaş V.D.", "2660002028179"], "GÖKSU DENTAL TİC. LTD.": ["VKN", "30482019487", "Maltepe V.D.", "2660003028180"], "ÖZLEM DENTAL KLİNİĞİ A.Ş.": ["VKN", "40482019488", "Beşiktaş V.D.", "2660004028181"], "DR. TOLGA YILDIZ POLİKLİNİĞİ": ["VKN", "50482019489", "Sarıyer V.D.", "2660005028182"], "GÜLÜŞ AĞIZ VE DİŞ SAĞLIĞI POLİKLİNİĞİ A.Ş.": ["VKN", "60482019490", "Sarıyer V.D.", "2660006028183"], "MEDİPORT DİŞ SAĞLIK MERKEZİ A.Ş.": ["VKN", "70482019491", "Beşiktaş V.D.", "2660007028184"], "DR. BURAK ÖZKAN POLİKLİNİĞİ": ["VKN", "80482019492", "Beylikdüzü V.D.", "2660008028185"], "ESTETİK DENT AĞIZ VE DİŞ SAĞLIĞI POL.": ["VKN", "90482019493", "Bakırköy V.D.", "2660009028186"], "MEHMET CAN": ["TC", "91827364501", "Kadıköy V.D.", "2660009182736"]};
const ADDR = 'Molla Gürani, Uygar Sokağı No:17 A, Fatih İstanbul Türkiye';
const PICKERS = {
  sales:   { title: 'Satış Sorumlusu', opts: ['DAVUT AKBULUT'] },
  ship:    { title: 'Teslimat Adresi', opts: [ADDR] },
  bill:    { title: 'Fatura Adresi', opts: [ADDR] }
};

function $(id){ return document.getElementById(id); }
function openSheet(id){ $('scrim').classList.add('open'); $(id).classList.add('open'); }
function closeSheets(){ $('scrim').classList.remove('open'); document.querySelectorAll('.sheet.open').forEach(s => s.classList.remove('open')); }

function openPicker(key){
  const p = PICKERS[key];
  const cur = document.querySelector('[data-v="' + key + '"]').textContent;
  $('pickTitle').textContent = p.title;
  $('pickList').innerHTML = '';
  p.opts.forEach(o => {
    const b = document.createElement('button');
    b.className = 'opt'; b.role = 'option'; b.textContent = o;
    b.setAttribute('aria-selected', o === cur);
    b.onclick = () => {
      const el = document.querySelector('[data-v="' + key + '"]');
      el.textContent = o;
      closeSheets();
    };
    $('pickList').appendChild(b);
  });
  openSheet('pickSheet');
}

function toggleSameAddr(){ $('billRow').hidden = $('sameAddr').checked; }
function showNote(){ $('noteBtn').hidden = true; $('noteWrap').hidden = false; $('description').focus(); }

function fmt(iso){ const [y,m,d] = iso.split('-'); return d + '.' + m + '.' + y; }
function addDays(iso, n){ const d = new Date(iso + 'T12:00:00'); d.setDate(d.getDate() + n); return d.toISOString().slice(0,10); }
function daysBetween(a, b){ return Math.round((new Date(b + 'T12:00:00') - new Date(a + 'T12:00:00')) / 864e5); }

function applyDue(){
  const sel = document.querySelector('[data-group="due"] [aria-pressed="true"]');
  if (sel) $('dueDate').value = addDays($('processDate').value, +sel.dataset.d);
  updateDueHint();
}
function customDue(){
  const n = daysBetween($('processDate').value, $('dueDate').value);
  document.querySelectorAll('[data-group="due"] button').forEach(b => b.setAttribute('aria-pressed', +b.dataset.d === n));
  updateDueHint();
}
function updateDueHint(){
  const on = $('isCreditSale').checked;
  $('dueHint').textContent = on ? 'Vade: ' + fmt($('dueDate').value) + ' (' + daysBetween($('processDate').value, $('dueDate').value) + ' gün)' : 'Peşin';
}
function toggleCredit(){ $('dueWrap').hidden = !$('isCreditSale').checked; updateDueHint(); }

// Segment ve çip grupları: tek seçim
document.querySelectorAll('[data-group]').forEach(g => g.addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  g.querySelectorAll('button').forEach(x => x.setAttribute('aria-pressed', x === b));
  if (g.dataset.group === 'cur'){
    $('exchangeRate').value = b.dataset.rate;
    $('rateWrap').hidden = b.dataset.rate === '1';
    $('rateNote').textContent = 'Kur: ' + b.dataset.rate;
  }
  if (g.dataset.group === 'due') applyDue();
}));

// Türkçe harf ve büyük/küçük harf duyarsız arama: "ozel", "ÖZEL", "özel" aynı sonucu verir. Uzunluk korunur, vurgulama için önemli.
function norm(t){ return t.toLocaleLowerCase('tr').normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/ı/g, 'i'); }
const CUST_N = CUSTOMERS.map(norm);
function initials(n){ return n.split(/\s+/).filter(w => !/\.$/.test(w)).slice(0, 2).map(w => w[0]).join('').toLocaleUpperCase('tr'); }
function esc(t){ return t.replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

const ID_ICON = {"TC": "<svg width=\"14\" height=\"14\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" aria-hidden=\"true\"><rect x=\"3\" y=\"5\" width=\"18\" height=\"14\" rx=\"2\"/><circle cx=\"9\" cy=\"11\" r=\"2\"/><path d=\"M6 16c.6-1.3 1.7-2 3-2s2.4.7 3 2M15 10h3M15 13h3\"/></svg>", "VKN": "<svg width=\"14\" height=\"14\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" aria-hidden=\"true\"><path d=\"M6 3h12v18l-3-2-3 2-3-2-3 2zM9 8h6M9 12h6M9 16h3\"/></svg>", "UTS": "<svg width=\"14\" height=\"14\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" aria-hidden=\"true\"><path d=\"M3 5v14M7 5v14M11 5v14M14 5v14M18 5v14M21 5v14\"/></svg>", "VD": "<svg width=\"14\" height=\"14\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" aria-hidden=\"true\"><path d=\"M3 21h18M5 21V10M9 21V10M15 21V10M19 21V10M2 10l10-6 10 6z\"/></svg>"};
function idsHtml(n){
  const d = CUST_INFO[n]; if (!d) return '';
  const chip = (k, lab, v, cls) => '<span class="id-chip' + (cls || '') + '" title="' + lab + ': ' + esc(v) + '" aria-label="' + lab + ' ' + esc(v) + '">' + ID_ICON[k] + '<span' + (cls ? '' : ' class="mono"') + '>' + esc(v) + '</span></span>';
  return chip(d[0] === 'TC' ? 'TC' : 'VKN', d[0], d[1]) + chip('UTS', 'ÜTS', d[3]) + chip('VD', 'Vergi Dairesi', d[2], ' vd');
}
// Ada ek olarak TC/VKN, ÜTS ve vergi dairesiyle de aranır
const CUST_S = CUSTOMERS.map(n => norm(n + ' ' + (CUST_INFO[n] || []).join(' ')));

function searchCust(q){
  const words = norm(q).trim().split(/\s+/).filter(Boolean);
  if (!words.length) return CUSTOMERS.map((n, i) => i).slice(0, 6);
  return CUST_N.map((n, i) => ({ i, n })).filter(o => words.every(w => CUST_S[o.i].includes(w)))
    // Başta eşleşen, sonra kelime başında eşleşen öne
    .sort((a, b) => (b.n.startsWith(words[0]) - a.n.startsWith(words[0])) || ((' ' + b.n).includes(' ' + words[0]) - (' ' + a.n).includes(' ' + words[0])))
    .slice(0, 8).map(o => o.i);
}

let custHits = [];
function renderCust(){
  const q = $('custQ').value;
  custHits = searchCust(q);
  $('custClear').hidden = !q;
  $('custHead').textContent = q.trim() ? custHits.length + ' sonuç' : 'Müşteriler (' + CUSTOMERS.length + ')';
  const w = norm(q).trim().split(/\s+/)[0] || '';
  $('custList').innerHTML = custHits.length ? custHits.map((i, k) => {
    const n = CUSTOMERS[i], at = w ? CUST_N[i].indexOf(w) : -1;
    const label = at < 0 ? esc(n) : esc(n.slice(0, at)) + '<mark>' + esc(n.slice(at, at + w.length)) + '</mark>' + esc(n.slice(at + w.length));
    return '<button class="cs-item' + (k === 0 && q.trim() ? ' hl' : '') + '" role="option" onclick="pickCust(' + i + ')"><span class="avatar">' + esc(initials(n)) + '</span><span class="tx"><span class="nm">' + label + '</span><span class="ids">' + idsHtml(n) + '</span></span></button>';
  }).join('') : '<div class="cs-empty">“' + esc(q.trim()) + '” ile eşleşen müşteri yok.</div>';
}
function custKey(e){
  if (e.key === 'Enter' && custHits.length && $('custQ').value.trim()){ e.preventDefault(); pickCust(custHits[0]); }
  if (e.key === 'Escape') clearCust();
}
function clearCust(){ $('custQ').value = ''; renderCust(); $('custQ').focus(); }
function pickCust(i){
  const n = CUSTOMERS[i];
  $('custName').textContent = n; $('custName').scrollLeft = 0; $('custIds').innerHTML = idsHtml(n); $('custInitials').textContent = initials(n);
  $('custSearch').hidden = true; $('custSel').hidden = false; $('salesRow').hidden = false;
  $('main').classList.remove('need-cust');
  $('custQ').blur();
}
function changeCust(){
  $('custSearch').hidden = false; $('custSel').hidden = true; $('salesRow').hidden = true;
  $('main').classList.add('need-cust');
  clearCust();
}

let toastTimer;
function toast(msg){ closeSheets(); const t = $('toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove('show'), 1800); }

function saveHeader(){
  if ($('main').classList.contains('need-cust')){ $('custQ').focus(); return toast('Önce müşteri seçin'); }
  if ($('isCreditSale').checked && $('dueDate').value < $('processDate').value) return toast('Vade tarihi işlem tarihinden önce olamaz');
  toast('Sipariş başlığı kaydedildi · Ürün ekleme adımı');
}

document.addEventListener('keydown', e => { if (e.key === 'Escape') closeSheets(); });

Object.assign(window, { openSheet, closeSheets, openPicker, toggleSameAddr, showNote, applyDue, customDue, toggleCredit, toast, saveHeader, renderCust, custKey, clearCust, pickCust, changeCust });

renderCust();
$('custQ').focus();

// self-check: vade hesabı, Türkçe arama
console.assert(norm('ÖZEL İĞDE ışık') === 'ozel igde isik' && CUSTOMERS.every((n, i) => CUST_N[i].length === n.length), 'norm uzunluğu bozuldu');
console.assert(CUSTOMERS[searchCust('6850803026')[0]].startsWith('ÖZEL GEBZE') && idsHtml('davut akbulut') === '', 'kimlik araması hatalı');
console.assert(CUSTOMERS[searchCust('ozel gebze')[0]].startsWith('ÖZEL GEBZE') && searchCust('dent').length > 0, 'müşteri araması hatalı');
console.assert(addDays('2026-11-06', 7) === '2026-11-13' && daysBetween('2026-11-06', '2026-11-13') === 7, 'vade hesabı hatalı');
</script>
